# ---------------------------------------------------------------------------
# Alert Eye Electronics — self-hosted stack (Oracle Cloud Always Free VM)
#
#   caddy   → TLS termination + reverse proxy (ports 80/443)
#   app     → Next.js storefront + Payload admin/API
#   db      → PostgreSQL 18
#   minio   → S3-compatible object storage for uploaded media
#
# Secrets and host-specific values live in deploy/.env (git-ignored).
# Bring the stack up with deploy/scripts/deploy.sh — do not `docker compose up`
# directly on a fresh host, the build + migrate steps must run first.
# ---------------------------------------------------------------------------
name: alerteye

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alerteye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-alerteye}
    volumes:
      # postgres:18 keeps data in /var/lib/postgresql/<major>/docker — mount the
      # parent so pg_upgrade stays possible across future major bumps.
      - pgdata:/var/lib/postgresql
    # Localhost-only, for `psql` / pg_dump from the host. Never exposed publicly.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alerteye} -d ${POSTGRES_DB:-alerteye}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/.env}
    volumes:
      - miniodata:/data
    # Console on localhost only; the S3 API is reached in-network as minio:9000
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  # One-shot: create the media bucket and make its objects publicly readable.
  # Invoked explicitly by deploy.sh (`docker compose run --rm minio-init`);
  # the profile keeps it out of plain `docker compose up`.
  minio-init:
    image: minio/mc:latest
    profiles: ["tools"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set s3 http://minio:9000 '${MINIO_ROOT_USER}' '${MINIO_ROOT_PASSWORD}' &&
      mc mb --ignore-existing s3/${S3_BUCKET:-alerteye-media} &&
      mc anonymous set download s3/${S3_BUCKET:-alerteye-media} &&
      echo 'minio-init: bucket ready' "
    restart: "no"
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: alerteye-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URI: postgres://${POSTGRES_USER:-alerteye}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-alerteye}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in deploy/.env}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?set NEXT_PUBLIC_SERVER_URL in deploy/.env}

      # Media — MinIO (S3-compatible). Reached in-network; served back to
      # browsers through the app's own /api/media route (proxied by Caddy).
      S3_BUCKET: ${S3_BUCKET:-alerteye-media}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      NEXT_PUBLIC_S3_PUBLIC_URL: ${NEXT_PUBLIC_S3_PUBLIC_URL:-}

      # Email — Resend
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_STAFF_INBOX: ${EMAIL_STAFF_INBOX:-}

      # Payments — Paystack
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY:-}

      # Payments — Safaricom Daraja (M-Pesa STK)
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
      MPESA_ALLOWED_IPS: ${MPESA_ALLOWED_IPS:-}

      # Checkout display copy
      NEXT_PUBLIC_MPESA_PAYBILL: ${NEXT_PUBLIC_MPESA_PAYBILL:-}
      NEXT_PUBLIC_BANK_DETAILS: ${NEXT_PUBLIC_BANK_DETAILS:-}
    volumes:
      # Compiled output produced by the deploy-time `next build`.
      - appbuild:/app/.next
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [internal]

volumes:
  pgdata:
  miniodata:
  appbuild:
  caddydata:
  caddyconfig:

networks:
  internal:
    driver: bridge
